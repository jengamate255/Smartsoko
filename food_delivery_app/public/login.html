<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>SmartSoko - Sign In</title>
  <meta name="description" content="Sign in to SmartSoko - Your local organic marketplace"/>
  
  <!-- Performance: Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  
  <!-- Preload critical CSS -->
  <link rel="preload" href="dist/tailwind.css" as="style">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Async load fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  
  <!-- Firebase Modular SDK -->
  <script type="module" src="config/firebase-config.js"></script>
  <script src="js/onboarding-guard.js"></script>
  
  <style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}body{min-height:100dvh}@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}.fade-up{animation:fadeUp .5s cubic-bezier(0.4,0,0.2,1) forwards}@keyframes leafFloat{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}.leaf{animation:leafFloat 7s ease-in-out infinite}.leaf-2{animation:leafFloat 9s ease-in-out infinite 1.5s}.leaf-3{animation:leafFloat 11s ease-in-out infinite 3s}.input-focus:focus{box-shadow:0 0 0 3px rgba(193,236,212,0.5);border-color:#a5d0b9;outline:none}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:shake .4s ease-in-out}</style>
</head>
<body class="bg-background font-body text-on-surface flex items-start sm:items-center justify-center min-h-screen py-10 sm:py-4 px-4 relative overflow-y-auto animate-premium">

  <!-- Decorative floating leaves -->
  <div class="absolute top-10 left-8 opacity-20 pointer-events-none leaf">
    <span class="material-symbols-outlined text-5xl text-primary" style="font-variation-settings:'FILL' 1;">eco</span>
  </div>
  <div class="absolute top-1/3 right-6 opacity-15 pointer-events-none leaf-2">
    <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings:'FILL' 1;">spa</span>
  </div>
  <div class="absolute bottom-20 left-1/4 opacity-10 pointer-events-none leaf-3">
    <span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings:'FILL' 1;">local_florist</span>
  </div>
  <div class="absolute bottom-10 right-10 opacity-15 pointer-events-none leaf">
    <span class="material-symbols-outlined text-5xl text-primary" style="font-variation-settings:'FILL' 1;">nutrition</span>
  </div>

  <!-- Card -->
  <div class="w-full max-w-sm bg-surface rounded-xl shadow-[0_24px_64px_rgba(1,45,29,0.12)] overflow-hidden fade-up" id="loginCard">

    <!-- Header -->
    <div class="bg-primary-container px-8 pt-10 pb-8 text-center relative overflow-hidden">
      <div class="absolute -top-8 -right-8 w-32 h-32 bg-primary-fixed/10 rounded-full"></div>
      <div class="absolute -bottom-6 -left-6 w-24 h-24 bg-primary-fixed/10 rounded-full"></div>
      <div class="relative z-10">
        <div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
          <span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings:'FILL' 1;">nutrition</span>
        </div>
        <h1 class="font-headline text-2xl font-extrabold text-primary tracking-tight">SmartSoko</h1>
      </div>
    </div>

    <!-- Form -->
    <div class="px-8 py-8">
      <h2 class="font-headline text-xl font-bold text-primary mb-6">Welcome back</h2>

      <!-- Email -->
      <div class="mb-5">
        <label class="block text-sm font-semibold text-on-surface mb-2" for="email">Email</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">mail</span>
          <input id="email" type="email" placeholder="you@example.com"
            class="input-focus w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-DEFAULT font-body text-on-surface placeholder:text-on-surface-variant/50 transition-all"/>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-2">
        <label class="block text-sm font-semibold text-on-surface mb-2" for="password">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">lock</span>
          <input id="password" type="password" placeholder="••••••••"
            class="input-focus w-full pl-12 pr-12 py-3.5 bg-surface-container-low border border-outline-variant rounded-DEFAULT font-body text-on-surface placeholder:text-on-surface-variant/50 transition-all"/>
          <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-xl" id="eyeIcon">visibility_off</span>
          </button>
        </div>
      </div>

      <!-- Save Password & Auto-login -->
      <div class="flex items-center gap-3 mb-6">
        <label class="flex items-center gap-2 cursor-pointer group">
          <div class="relative">
            <input type="checkbox" id="savePassword" class="peer sr-only"/>
            <div class="w-10 h-6 bg-surface-container-low peer-checked:bg-primary rounded-full transition-colors border-2 border-transparent peer-focus:ring-2 peer-focus:ring-primary/30"></div>
            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow peer-checked:translate-x-4 transition-transform"></div>
          </div>
          <span class="text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Save password & auto-login</span>
        </label>
      </div>

      <!-- Forgot password -->
      <div class="text-right mb-6">
        <button onclick="openForgotModal()" class="text-sm text-secondary font-semibold hover:opacity-80 transition-opacity">Forgot password?</button>
      </div>

      <!-- Error -->
      <div id="errorMsg" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded-DEFAULT text-sm font-body"></div>

      <!-- Sign In button -->
      <button id="signInBtn" onclick="login()"
        class="w-full bg-primary text-on-primary py-4 rounded-full font-headline font-bold text-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
        <span class="material-symbols-outlined text-xl">login</span>
        Sign In
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-outline-variant"></div>
        <span class="text-xs text-on-surface-variant font-body">or</span>
        <div class="flex-1 h-px bg-outline-variant"></div>
      </div>

      <!-- Google -->
      <button id="googleBtn" onclick="signInWithGoogle()"
        class="w-full py-3.5 rounded-full bg-surface-container border border-outline-variant flex items-center justify-center gap-3 font-headline font-semibold text-sm text-on-surface hover:bg-surface-container-high transition-all active:scale-95">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="text-center mt-6 text-sm text-on-surface-variant font-body">
        New here?
        <a href="/signup" class="text-secondary font-semibold hover:opacity-80 transition-opacity ml-1">Create account</a>
      </p>

    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="hidden fixed inset-0 bg-primary/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-surface rounded-xl shadow-2xl overflow-hidden fade-up">
      <div class="px-8 py-6 border-b border-outline-variant">
        <h3 class="font-headline text-lg font-bold text-primary">Reset Password</h3>
        <p class="text-sm text-on-surface-variant mt-1">Enter your email and we'll send a reset link.</p>
      </div>
      <div class="px-8 py-6">
        <div class="relative mb-4">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">mail</span>
          <input id="resetEmail" type="email" placeholder="you@example.com"
            class="input-focus w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-DEFAULT font-body text-on-surface placeholder:text-on-surface-variant/50 transition-all"/>
        </div>
        <div id="resetError" class="hidden mb-3 text-red-600 text-sm font-body"></div>
        <div id="resetSuccess" class="hidden mb-3 text-green-700 text-sm font-body"></div>
        <div class="flex gap-3">
          <button onclick="closeForgotModal()" class="flex-1 py-3 rounded-full border border-outline-variant text-on-surface font-headline font-semibold text-sm hover:bg-surface-container transition-all">Cancel</button>
          <button id="resetBtn" onclick="sendResetEmail()" class="flex-1 py-3 rounded-full bg-primary text-on-primary font-headline font-semibold text-sm hover:opacity-90 transition-all">Send Link</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Auto-login on page load if "Save Password" was checked
    document.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('smartsoko_email');
      const savedPassword = localStorage.getItem('smartsoko_password');
      const savePassword = localStorage.getItem('smartsoko_save_password') === 'true';
      
      if (savePassword && savedEmail && savedPassword) {
        // Auto-fill email and password
        document.getElementById('email').value = savedEmail;
        document.getElementById('password').value = savedPassword;
        document.getElementById('savePassword').checked = true;
        
        // Auto-login after a short delay
        setTimeout(() => {
          login();
        }, 500);
      }
    });

    // Prevent premature redirects - only redirect after explicit sign-in action
    let _authListenerActive = false;
    let _isSigningIn = false;

    async function initLogin() {
      const urlParams = new URLSearchParams(window.location.search);
      const reason = urlParams.get('reason');
      
      if (reason === 'unauthorized') {
        // Show a subtle hint but don't block login
      }

      const auth = window.auth;
      if (!auth) return;

      // Set up auth state listener that ONLY acts during explicit sign-in
      _authListenerActive = true;
      auth.onAuthStateChanged(async function(user) {
        if (!user || !_authListenerActive) return;
        
        // Only redirect if user is actively signing in
        if (_isSigningIn) {
          console.log('Auth state changed during sign-in, checking role...');
          await checkRoleAndRedirect(user.uid);
        }
        // If not _isSigningIn, user was already logged in - don't auto-redirect
      });

      // Handle redirect result from Google sign-in
      try {
        const { getRedirectResult } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
        const result = await getRedirectResult(auth);
        if (result && result.user) {
          console.log('Google redirect result received');
          _isSigningIn = true;
          await handleGoogleSignInSuccess(result.user);
        }
      } catch (e) {
        console.log('No redirect result:', e.message);
      }
    }
    
    document.addEventListener('DOMContentLoaded', initLogin);

    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      input.type  = input.type === 'password' ? 'text' : 'password';
      icon.textContent = input.type === 'password' ? 'visibility_off' : 'visibility';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('loginCard').classList.add('shake');
      setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 400);
    }

    function clearError() { document.getElementById('errorMsg').classList.add('hidden'); }

    async function login() {
      clearError();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const savePassword = document.getElementById('savePassword').checked;
      
      if (!email || !password) { showError('Please enter your email and password.'); return; }

      const btn = document.getElementById('signInBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">refresh</span> Signing in...';

      const auth = window.auth;
      if (!auth) { 
        showError('Authentication service not connected. Please try again later.'); 
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-xl">login</span> Sign In';
        return; 
      }

      try {
        const { signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
        _isSigningIn = true;
        const cred = await signInWithEmailAndPassword(auth, email, password);
        
        // Save credentials if checkbox is checked
        if (savePassword) {
          localStorage.setItem('smartsoko_email', email);
          localStorage.setItem('smartsoko_password', password);
          localStorage.setItem('smartsoko_save_password', 'true');
        } else {
          // Clear saved credentials if checkbox is unchecked
          localStorage.removeItem('smartsoko_email');
          localStorage.removeItem('smartsoko_password');
          localStorage.setItem('smartsoko_save_password', 'false');
        }
        
        await checkRoleAndRedirect(cred.user.uid);
      } catch (err) {
        console.error('Firebase Auth Error:', err);
        _isSigningIn = false;
        const msgs = {
          'auth/user-not-found': 'No account with that email.',
          'auth/wrong-password': 'Incorrect password.',
          'auth/invalid-email': 'Invalid email format.',
          'auth/too-many-requests': 'Too many attempts — try later.',
          'auth/invalid-credential': 'Invalid email or password.',
          'auth/network-request-failed': 'Network error. Please check your connection.',
        };
        showError(msgs[err.code] || 'Sign in failed. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-xl">login</span> Sign In';
      }
    }

    async function checkRoleAndRedirect(uid) {
      const db = window.db;
      if (!db) {
        console.warn('Firestore not available, redirecting to customer page');
        window.location.href = '/index';
        return;
      }
      try {
        const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
        
        // Check users collection first
        const userDocRef = doc(db, 'users', uid);
        const userSnap = await getDoc(userDocRef);
        
        if (userSnap.exists()) {
          const userData = userSnap.data();
          window.SmartSokoOnboarding.redirectAfterAuth(userData, userData.role || 'customer');
          return;
        }

        // Check legacy collections
        const legacyCollections = [
          { name: 'customers', role: 'customer' },
          { name: 'drivers', role: 'driver' },
          { name: 'restaurants', role: 'merchant' },
          { name: 'sellers', role: 'merchant' }
        ];

        for (const col of legacyCollections) {
          try {
            const legacySnap = await getDoc(doc(db, col.name, uid));
            if (legacySnap.exists()) {
              const data = legacySnap.data();
              window.SmartSokoOnboarding.redirectAfterAuth(data, col.role);
              return;
            }
          } catch (e) {
            // Collection might not exist
          }
        }

        // No profile found - create one and redirect to onboarding
        const auth = window.auth;
        const currentUser = auth?.currentUser;
        if (currentUser) {
          const { setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
          await setDoc(userDocRef, {
            email: currentUser.email || '',
            name: currentUser.displayName || '',
            fullName: currentUser.displayName || '',
            role: 'customer',
            createdAt: serverTimestamp(),
            onboardingComplete: false,
            onboardingVersion: window.SmartSokoOnboarding.ONBOARDING_VERSION
          });
          window.location.href = '/onboarding';
        } else {
          window.location.href = '/index';
        }
      } catch (err) {
        console.error('Error checking role:', err);
        window.location.href = '/index';
      }
    }

    async function handleGoogleSignInSuccess(user) {
      const db = window.db;
      if (!db) {
        window.location.href = '/index';
        return;
      }

      try {
        const { doc, getDoc, setDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
        const userDocRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userDocRef);

        if (!userSnap.exists()) {
          // New Google user - create profile
          await setDoc(userDocRef, {
            email: user.email || '',
            name: user.displayName || '',
            fullName: user.displayName || '',
            role: 'customer',
            createdAt: serverTimestamp(),
            emailVerified: user.emailVerified || false,
            photoURL: user.photoURL || null,
            onboardingComplete: false,
            onboardingVersion: window.SmartSokoOnboarding.ONBOARDING_VERSION
          });
        }

        const userData = userSnap.exists() ? userSnap.data() : {
          email: user.email || '',
          name: user.displayName || '',
          role: 'customer',
          onboardingComplete: false,
          onboardingVersion: window.SmartSokoOnboarding.ONBOARDING_VERSION
        };

        // Save email for auto-login if checkbox is checked
        const savePassword = document.getElementById('savePassword').checked;
        if (savePassword && user.email) {
          localStorage.setItem('smartsoko_email', user.email);
          localStorage.setItem('smartsoko_save_password', 'true');
        }

        window.SmartSokoOnboarding.redirectAfterAuth(userData, userData.role || 'customer');
      } catch (err) {
        console.error('Error handling Google sign-in:', err);
        showError('Failed to complete sign-in. Please try again.');
        _isSigningIn = false;
        resetGoogleButton();
      }
    }

    async function signInWithGoogle() {
      clearError();
      
      const auth = window.auth;
      if (!auth) {
        showError('Sign-in service is loading. Please try again.');
        return;
      }
      
      const btn = document.getElementById('googleBtn');
      _isSigningIn = true;
      if (btn) btn.disabled = true;
      
      try {
        const { GoogleAuthProvider, signInWithPopup } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
        
        const provider = new GoogleAuthProvider();
        provider.addScope('profile');
        provider.addScope('email');
        
        console.log('Starting Google Sign-In with popup...');
        const result = await signInWithPopup(auth, provider);
        
        if (result && result.user) {
          await handleGoogleSignInSuccess(result.user);
        }
      } catch (err) {
        console.error('Google Sign-In Error:', err);
        _isSigningIn = false;
        resetGoogleButton();
        
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
          // User closed popup - not an error
          return;
        } else if (err.code === 'auth/popup-blocked') {
          showError('Popup blocked by browser. Please allow popups for this site.');
        } else if (err.code === 'auth/network-request-failed') {
          showError('Network error. Please check your internet connection.');
        } else if (err.code === 'auth/unauthorized-domain') {
          showError('This domain is not authorized for Google Sign-In. Please contact support.');
        } else if (err.code === 'auth/operation-not-allowed') {
          showError('Google Sign-In is not enabled. Please use email login.');
        } else if (err.code === 'auth/account-exists-with-different-credential') {
          showError('An account with this email already exists using a different sign-in method.');
        } else {
          console.error('Google Sign-In Error Details:', err.message, err.code);
          showError('Unable to sign in with Google. Please try email login.');
        }
      }
    }

    function resetGoogleButton() {
      const btn = document.getElementById('googleBtn');
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google';
      }
    }

    // Forgot password
    function openForgotModal() {
      document.getElementById('resetEmail').value = document.getElementById('email').value;
      document.getElementById('forgotModal').classList.remove('hidden');
    }
    function closeForgotModal() {
      document.getElementById('forgotModal').classList.add('hidden');
      document.getElementById('resetError').classList.add('hidden');
      document.getElementById('resetSuccess').classList.add('hidden');
    }
    async function sendResetEmail() {
      const email = document.getElementById('resetEmail').value.trim();
      const errEl = document.getElementById('resetError');
      const sucEl = document.getElementById('resetSuccess');
      errEl.classList.add('hidden'); sucEl.classList.add('hidden');
      if (!email) { errEl.textContent = 'Please enter your email.'; errEl.classList.remove('hidden'); return; }
      
      const auth = window.auth;
      if (!auth) { errEl.textContent = 'Password reset not available.'; errEl.classList.remove('hidden'); return; }
      
      const btn = document.getElementById('resetBtn');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const { sendPasswordResetEmail } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
        await sendPasswordResetEmail(auth, email);
        sucEl.textContent = 'Reset link sent! Check your inbox.';
        sucEl.classList.remove('hidden');
        setTimeout(closeForgotModal, 3000);
      } catch (err) {
        errEl.textContent = err.code === 'auth/user-not-found' ? 'No account with that email.' : 'Failed to send link.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'Send Link';
      }
    }

    // Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
