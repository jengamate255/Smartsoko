<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>SmartSoko - Chat with Rider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="dist/tailwind.css" as="style">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script type="module" src="config/firebase-config.js?v=5"></script>
  <script type="module" src="config/cross-platform-service.js?v=4"></script>
  <script src="nav-component.js?v=5" defer></script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; display: inline-block; line-height: 1; vertical-align: middle; }
    .filled-icon { font-variation-settings: 'FILL' 1; }
    * { box-sizing: border-box; }
    body { font-family: 'Inter','Montserrat',sans-serif; min-height: 100vh; background: #F8FAF6; }
    h1,h2,h3,h4,h5,h6 { font-family: 'Montserrat',sans-serif; }
    .gradient-bg { background: #064e3b; }
    .chat-container { scrollbar-width: thin; scrollbar-color: #ECFDF5 transparent; }
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background-color: #ECFDF5; border-radius: 3px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .message-bubble { max-width: 75%; word-wrap: break-word; }
    .typing-indicator span { animation: typing 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
    .driver-online { background: #16a34a !important; animation: pulse-ring 2s infinite; }
    .driver-offline { background: #9ca3af !important; animation: none; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(22, 163, 74, 0); } 100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); } }
  </style>
</head>
<body class="bg-[#F8FAF6] text-gray-900 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-white/80 backdrop-blur-xl fixed top-0 w-full z-50 shadow-sm flex justify-between items-center px-4 md:px-12 h-16">
    <div class="flex items-center gap-2">
      <a href="/customer" class="flex items-center gap-2 text-white no-underline">
        <div class="w-9 h-9 bg-green-700/15 rounded-lg flex items-center justify-center">
          <span class="material-symbols-outlined text-green-700">shopping_basket</span>
        </div>
        <span class="text-lg font-bold hidden sm:block">SmartSoko</span>
      </a>
      <span id="chatTitle" class="text-sm font-semibold text-gray-700 ml-2"></span>
    </div>
    <div class="flex items-center gap-3">
      <a href="/customer" class="relative p-2 text-green-700/80 hover:text-green-700 rounded-full">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
    </div>
  </header>

  <main class="flex-1 pt-4 pb-24 px-4 overflow-y-auto" id="chatContainer">
    <!-- Order Info Card -->
    <div class="bg-white rounded-xl shadow-[0px_2px_8px_rgba(44,62,80,0.05)] border border-transparent hover:border-green-100 transition-all p-4 mb-6">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
          <span class="material-symbols-outlined text-green-700">receipt</span>
        </div>
        <div>
          <p class="font-semibold text-gray-900">Order #<span id="orderId">-</span></p>
          <p class="text-xs text-gray-500">2 items â€¢ TSh <span id="orderTotal">0</span></p>
        </div>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
        <div id="deliveryProgress" class="h-full bg-green-700 rounded-full transition-all duration-500" style="width: 60%"></div>
      </div>
    </div>

    <!-- Date Separator -->
    <div class="flex items-center justify-center my-4">
      <span class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full">Today</span>
    </div>

    <!-- Messages -->
    <div id="messagesList" class="space-y-4">
      <div class="flex justify-start">
        <div class="message-bubble bg-white rounded-2xl rounded-tl-none p-3 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-900">Hello! I'm your delivery rider. I'll be delivering your order soon. Feel free to message me if you have any questions!</p>
          <span class="text-[10px] text-gray-400 mt-1 block">Just now</span>
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="hidden flex justify-start mt-2">
      <div class="bg-white rounded-2xl rounded-tl-none p-3 shadow-sm border border-gray-100">
        <div class="typing-indicator flex gap-1">
          <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
          <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
          <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
        </div>
      </div>
    </div>
  </main>

  <!-- Quick Actions -->
  <div class="fixed bottom-20 left-0 right-0 px-4 z-40">
    <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
      <button onclick="sendQuickMessage('I&apos;m at the location')" class="whitespace-nowrap px-4 py-2 bg-white rounded-full text-sm text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50 transition-colors">I'm at the location</button>
      <button onclick="sendQuickMessage('Please call when you arrive')" class="whitespace-nowrap px-4 py-2 bg-white rounded-full text-sm text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50 transition-colors">Call when arrive</button>
      <button onclick="sendQuickMessage('Leave at the door')" class="whitespace-nowrap px-4 py-2 bg-white rounded-full text-sm text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50 transition-colors">Leave at door</button>
      <button onclick="sendQuickMessage('I&apos;m running late')" class="whitespace-nowrap px-4 py-2 bg-white rounded-full text-sm text-gray-700 shadow-sm border border-gray-200 hover:bg-gray-50 transition-colors">Running late</button>
    </div>
  </div>

  <!-- Message Input -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-3 z-50">
    <div class="flex items-center gap-2 max-w-2xl mx-auto">
      <button class="w-10 h-10 flex items-center justify-center text-gray-400 hover:bg-gray-100 rounded-full transition-colors">
        <span class="material-symbols-outlined">add</span>
      </button>
      <div class="flex-1 relative">
        <input 
          type="text" 
          id="messageInput" aria-label="Type a message" 
          placeholder="Type a message..." 
          class="w-full pl-4 pr-12 py-3 bg-gray-50 rounded-full text-gray-900 placeholder:text-gray-400 focus:ring-2 focus:ring-green-700/20 focus:border-green-700 outline-none"
          onkeypress="handleKeyPress(event)"
        />
        <button 
          onclick="sendMessage()" 
          id="sendButton"
          class="absolute right-1.5 top-1/2 transform -translate-y-1/2 w-9 h-9 gradient-bg text-white rounded-full flex items-center justify-center shadow-md hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="material-symbols-outlined text-sm">send</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- Order Info Modal -->
  <div id="orderInfoModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
    <div class="bg-white rounded-t-3xl md:rounded-2xl w-full max-w-md p-6 animate-slide-up">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-gray-900">Order Details</h3>
        <button onclick="closeOrderInfo()" class="p-2 hover:bg-gray-100 rounded-full transition-colors"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="space-y-4" id="orderInfoContent"></div>
    </div>
  </div>

  <script>
    let currentOrder = null;
    let currentUser = JSON.parse(localStorage.getItem('smartsoko_user')) || { name: 'Customer', phone: '' };
    let riderInfo = null;
    let chatId = null;
    let unsubscribe = null;

    function pickNumber(...values) {
      for (const v of values) {
        if (v !== undefined && v !== null && v !== '' && !Number.isNaN(Number(v))) return Number(v);
      }
      return null;
    }

    function formatTime(ts) {
      if (!ts) return 'Just now';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const diff = Math.floor((Date.now() - d) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return d.toLocaleDateString();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof SmartNav !== 'undefined' && typeof SmartNav.initPageTransition === 'function') SmartNav.initPageTransition();
      await loadOrderInfo();
      loadChat();
    });

    async function loadOrderInfo() {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId') || urlParams.get('order') || localStorage.getItem('smartsoko_current_order');
      window.chatRole = urlParams.get('role') || 'customer';
      const titleEl = document.getElementById('chatTitle');
      if (titleEl) titleEl.textContent = window.chatRole === 'driver' ? 'Chat with Customer' : 'Chat with Rider';
      
      if (!orderId) {
        showError('No order specified');
        return;
      }

      let orderData = null;
      const svc = window.crossPlatformService;
      if (svc && svc.isReady()) {
        try { orderData = await svc.get('orders', orderId); } catch(e) { /* silent */ }
      }
      if (!orderData) {
        const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
        const orderDoc = await getDoc(doc(window.db, 'orders', orderId));
        if (orderDoc.exists()) orderData = { id: orderDoc.id, ...orderDoc.data() };
      }

      if (orderData) {
        currentOrder = orderData;
        displayOrderInfo();
        loadRiderInfo(currentOrder.driverId);
        initChat(orderId);
        return;
      }
      // Demo data
      currentOrder = {
        id: orderId,
        status: 'dispatched',
        items: [
          { name: 'Chicken Biryani', quantity: 2, price: 15000 },
          { name: 'Soft Drink', quantity: 2, price: 2000 }
        ],
        subtotal: 34000,
        deliveryFee: 3000,
        total: 37000,
        sellerName: 'Tasty Restaurant',
        sellerLat: -6.7924,
        sellerLng: 39.2083,
        customerAddress: '123 Sample Street, Dar es Salaam',
        driverId: 'driver-1',
        createdAt: new Date(Date.now() - 3600000),
        estimatedDelivery: new Date(Date.now() + 1800000)
      };
      displayOrderInfo();
      loadRiderInfo(currentOrder.driverId);
      initChat(orderId);
    }

    function displayOrderInfo() {
      if (!currentOrder) return;

      document.getElementById('orderId').textContent = currentOrder.id.substring(0, 8).toUpperCase();
      document.getElementById('orderTotal').textContent = (currentOrder.total || 0).toLocaleString();

      const statusMap = {
        'confirmed': { text: 'Order Confirmed', icon: 'check_circle', width: '25%' },
        'preparing': { text: 'Preparing', icon: 'restaurant', width: '40%' },
        'ready_for_delivery': { text: 'Ready for Pickup', icon: 'package', width: '50%' },
        'dispatched': { text: 'On the Way', icon: 'local_shipping', width: '60%' },
        'delivered': { text: 'Delivered', icon: 'check_circle', width: '100%' }
      };
      
      const status = statusMap[currentOrder.status] || statusMap['dispatched'];
      document.getElementById('deliveryProgress').style.width = status.width;
    }

    async function loadRiderInfo(driverId) {
      riderInfo = {
        name: currentOrder?.driverName || 'Your Rider',
        phone: currentOrder?.driverPhone || null,
        rating: currentOrder?.driverRating || null,
        deliveries: currentOrder?.driverDeliveries || null
      };

      if (!driverId) {
        // Use mock rider info
        riderInfo = {
          name: currentOrder?.driverName || 'Your Rider',
          phone: currentOrder?.driverPhone || '+255 123 456 789',
          rating: 4.8,
          deliveries: 1240
        };
        displayRiderInfo();
        return;
      }

      let driverData = null;
      const svc = window.crossPlatformService;
      if (svc && svc.isReady()) {
        try { driverData = await svc.get('drivers', driverId); } catch(e) { /* silent */ }
      }
      if (driverData) {
        riderInfo = {
          id: driverId,
          name: driverData.name || driverData.fullName || riderInfo.name,
          phone: driverData.phone || driverData.phoneNumber || riderInfo.phone,
          rating: driverData.rating || riderInfo.rating,
          deliveries: driverData.deliveries || driverData.totalDeliveries || riderInfo.deliveries
        };
      } else {
        const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
        try {
          const docSnap = await getDoc(doc(db, 'drivers', driverId));
          if (docSnap.exists()) {
            const fData = docSnap.data();
            riderInfo = { 
              id: docSnap.id, 
              name: fData.name || fData.fullName || riderInfo.name,
              phone: fData.phone || fData.phoneNumber || riderInfo.phone,
              rating: fData.rating || riderInfo.rating,
              deliveries: fData.deliveries || fData.totalDeliveries || riderInfo.deliveries
            };
          }
        } catch (error) {
          console.warn('Error loading driver info:', error);
        }
      }
      displayRiderInfo();
    }

    function displayRiderInfo() {
      if (!riderInfo) return;
      // Rider info displayed in order card
    }

    function initChat(orderId) {
      chatId = `order_${orderId}`;
      let pollInterval = null;

      // Try Firebase real-time first
      if (window.db) {
        const { collection, doc, query, orderBy, onSnapshot } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
        unsubscribe = onSnapshot(query(collection(doc(window.db, 'chats', chatId), 'messages'), orderBy('timestamp', 'asc')), (snapshot) => {
            snapshot.docChanges().forEach((change) => {
              if (change.type === 'added') {
                const message = change.doc.data();
                displayMessage(message);
              }
            });
          }, () => {
            console.log('Chat not connected to Firebase');
          });
        return;
      }

      // Fall back to polling with cross-platform
      const svc = window.crossPlatformService;
      if (svc && svc.isReady()) {
        pollInterval = setInterval(async () => {
          try {
            const msgs = await svc.list('chats/' + chatId + '/messages', { orderBy: { field: 'timestamp', direction: 'asc' } });
            msgs.forEach(msg => displayMessage(msg));
          } catch(e) { /* silent */ }
        }, 3000);
      }
    }

    function loadChat() {
      const savedMessages = JSON.parse(localStorage.getItem(`smartsoko_chat_${chatId}`)) || [];
      savedMessages.forEach(msg => displayMessage(msg, false));
    }

    function displayMessage(message, save = true) {
      const container = document.getElementById('messagesList');
      const isDriver = window.chatRole === 'driver';
      const isMe = isDriver
        ? (message.sender === 'rider' || message.senderId === (riderInfo?.id || 'rider'))
        : (message.sender === 'customer' || message.senderId === currentUser.phone);
      
      const messageHtml = `
        <div class="flex justify-${isMe ? 'end' : 'start'} animate-fade-in">
          <div class="message-bubble ${isMe ? 'bg-green-700 text-white rounded-2xl rounded-tr-none' : 'bg-white rounded-2xl rounded-tl-none border border-gray-100'} p-3 shadow-sm">
            <p class="text-sm">${message.text}</p>
            <span class="text-[10px] ${isMe ? 'text-white/70' : 'text-gray-400'} mt-1 block">
              ${formatTime(message.timestamp)}
            </span>
          </div>
        </div>`;
      
      container.insertAdjacentHTML('beforeend', messageHtml);
      scrollToBottom();

      if (save) {
        const savedMessages = JSON.parse(localStorage.getItem(`smartsoko_chat_${chatId}`)) || [];
        savedMessages.push(message);
        localStorage.setItem(`smartsoko_chat_${chatId}`, JSON.stringify(savedMessages));
      }
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (!text) return;

      const isDriver = window.chatRole === 'driver';
      const message = {
        text: text,
        sender: isDriver ? 'rider' : 'customer',
        senderId: isDriver ? (riderInfo?.id || 'rider') : (currentUser.phone || 'customer'),
        senderName: isDriver ? (riderInfo?.name || 'Rider') : (currentUser.name || 'Customer'),
        timestamp: new Date().toISOString()
      };

      // Display immediately
      displayMessage(message);
      input.value = '';

      // Try to save via cross-platform service or Firebase
      if (chatId) {
        const svc = window.crossPlatformService;
        if (svc && svc.isReady()) {
          await svc.create('chats/' + chatId + '/messages', message);
        } else {
          const { collection, doc, addDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js');
          addDoc(collection(doc(window.db, 'chats', chatId), 'messages'), {
            ...message,
            timestamp: serverTimestamp()
          }).catch(() => {
            // Already saved to localStorage in displayMessage
          });
        }
      }

      // Simulate rider response after 2 seconds (customer side only)
      if (!isDriver) {
        setTimeout(() => {
          showTypingIndicator();
          setTimeout(() => {
            hideTypingIndicator();
            const riderResponse = {
              text: getRiderResponse(text),
              sender: 'rider',
              senderId: riderInfo?.id || 'rider',
              senderName: riderInfo?.name || 'Rider',
              timestamp: new Date().toISOString()
            };
            displayMessage(riderResponse);
          }, 2000);
        }, 1000);
      }
    }

    function sendQuickMessage(text) {
      document.getElementById('messageInput').value = text;
      sendMessage();
    }

    function getRiderResponse(customerMessage) {
      const responses = {
        'location': "I'm heading there now! See you soon.",
        'call': "Sure, I'll call you when I'm nearby.",
        'door': "No problem, I'll leave it at the door as requested.",
        'late': "No worries, take your time. I'll wait for you.",
        'default': "Got it! Thanks for letting me know."
      };
      
      const lowerMsg = customerMessage.toLowerCase();
      if (lowerMsg.includes('location')) return responses.location;
      if (lowerMsg.includes('call')) return responses.call;
      if (lowerMsg.includes('door')) return responses.door;
      if (lowerMsg.includes('late')) return responses.late;
      return responses.default;
    }

    function showTypingIndicator() {
      document.getElementById('typingIndicator').classList.remove('hidden');
      scrollToBottom();
    }

    function hideTypingIndicator() {
      document.getElementById('typingIndicator').classList.add('hidden');
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTop = container.scrollHeight;
    }

    function formatTime(ts) {
      if (!ts) return 'Just now';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const diff = Math.floor((Date.now() - d) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return d.toLocaleDateString();
    }

    function showError(message) {
      const riderEl = document.getElementById('riderName');
      if (riderEl) riderEl.textContent = 'Error';
      showToast(message);
    }

    function showToast(message) {
      if (typeof SmartNav !== 'undefined' && SmartNav.showToast) { SmartNav.showToast(message, 'info'); return; }
      const el = document.createElement('div');
      el.className = 'fixed top-24 right-6 bg-gray-900 text-white px-4 py-3 rounded-full shadow-lg z-50 text-sm font-medium';
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function callRider() {
      if (riderInfo?.phone) {
        window.location.href = `tel:${riderInfo.phone}`;
      } else {
        showToast('Phone number not available');
      }
    }
  </script>
</body>
</html>
