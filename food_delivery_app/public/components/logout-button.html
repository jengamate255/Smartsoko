<!-- SmartSoko Logout Button Component -->
<!-- Include this in any page where you want a logout button -->

<!-- Include the logout script -->
<script src="../js/logout.js"></script>

<!-- Logout Button Styles -->
<style>
  .smartsoko-logout-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
  }

  .smartsoko-logout-btn:hover {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    transform: translateY(-1px);
    box-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
  }

  .smartsoko-logout-btn:active {
    transform: translateY(0);
    box-shadow: 0 1px 2px rgba(239, 68, 68, 0.2);
  }

  .smartsoko-logout-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .smartsoko-logout-btn .material-symbols-outlined {
    font-size: 18px;
  }

  /* Icon-only variant */
  .smartsoko-logout-btn.icon-only {
    padding: 10px;
    border-radius: 50%;
  }

  /* Outline variant */
  .smartsoko-logout-btn.outline {
    background: transparent;
    color: #ef4444;
    border: 2px solid #ef4444;
  }

  .smartsoko-logout-btn.outline:hover {
    background: #ef4444;
    color: white;
  }

  /* Small variant */
  .smartsoko-logout-btn.small {
    padding: 6px 12px;
    font-size: 12px;
  }

  .smartsoko-logout-btn.small .material-symbols-outlined {
    font-size: 14px;
  }

  /* Navbar integration */
  .navbar .smartsoko-logout-btn {
    padding: 8px 16px;
    font-size: 13px;
  }
</style>

<!-- Standard Logout Button -->
<button 
  class="smartsoko-logout-btn" 
  onclick="SmartSokoLogout.handleLogoutClick(event, { confirm: false })"
  title="Log out">
  <span class="material-symbols-outlined">logout</span>
  <span>Logout</span>
</button>
