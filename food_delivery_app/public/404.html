<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — SmartSoko</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1B4332">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #FAF7F2; color: #1E2A22; text-align: center; padding: 24px;
        }
        .card { max-width: 440px; }
        .code {
            font-size: 96px; font-weight: 800; line-height: 1; letter-spacing: -.04em;
            background: linear-gradient(135deg, #1B4332, #10B981);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 8px;
        }
        h1 { font-size: 24px; margin: 0 0 12px; }
        p { font-size: 16px; line-height: 1.6; color: #414844; margin: 0 0 28px; }
        a.btn {
            display: inline-block; padding: 14px 32px; border-radius: 999px;
            background: #1B4332; color: #fff; font-weight: 700; text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
            box-shadow: 0 4px 14px rgba(27,67,50,.3);
        }
        a.btn:hover { background: #2D6A4F; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(27,67,50,.35); }
        @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } a.btn:hover { transform: none; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>This page took a wrong turn</h1>
        <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the fresh stuff.</p>
        <a class="btn" href="/">Back to SmartSoko</a>
    </main>
</body>
</html>
