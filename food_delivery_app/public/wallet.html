<!DOCTYPE html>
<html lang="sw">
<head>
  <script src="/config/api-origin.js"></script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartSoko - My Wallet</title>
  <meta name="description" content="Your SmartSoko wallet: balance, nTZS and M-Pesa payments, deposits, and withdrawal status in one place.">
  <meta property="og:title" content="SmartSoko Wallet">
  <meta property="og:description" content="Balance, payments and withdrawals — all in one place.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#064e3b">
  <link rel="preload" href="dist/tailwind.css" as="style">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', 'Montserrat', sans-serif; background: #F8FAF6; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Montserrat', sans-serif; }
    .ntzs-card { border-left: 4px solid #7c3aed; }
    .status-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; }
    .status-pending { background: #FEF3C7; color: #92400E; }
    .status-completed { background: #D1FAE5; color: #065F46; }
    .status-failed { background: #FEE2E2; color: #991B1B; }
    .spin { animation: nspin 1s linear infinite; }
    @keyframes nspin { to { transform: rotate(360deg); } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stitch-site.css?v=5">
  <script src="js/i18n.js?v=1" defer></script>
  <script src="js/stitch-site.js?v=2" defer></script>
  <link rel="stylesheet" href="css/site-uniform.css?v=1">
  <link rel="stylesheet" href="/css/shopping-shell.css?v=1">
  <script src="/js/shopping-shell.js?v=1" defer></script>
  <link rel="manifest" href="/manifest.json">

</head>
<body class="ss-uniform stitch-site ss-commerce ss-wallet" data-stitch-page="wallet">
  <header class="sticky top-0 z-40 bg-[#064e3b] text-white">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center gap-4">
      <a href="home.html" class="flex items-center gap-2 hover:opacity-90" aria-label="Back to home" data-i18n-aria-label="common.backToHome">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <div class="flex-1">
        <h1 class="font-bold text-lg leading-tight" data-i18n="wallet.title">My Wallet</h1>
        <p class="text-xs text-white/70" data-i18n="wallet.subtitle">Balance, payments and withdrawals</p>
      </div>
      <a href="profile.html" class="w-9 h-9 rounded-lg bg-white/15 flex items-center justify-center hover:bg-white/25 transition-colors" aria-label="Profile">
        <span class="material-symbols-outlined">person</span>
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <!-- nTZS deposit status banner (shown after checkout redirects here) -->
    <div id="ntzsBanner" class="hidden mb-4"></div>

    <div id="walletError" class="hidden mb-4 px-4 py-3 rounded-xl bg-amber-50 border border-amber-200" role="alert"><span data-i18n="wallet.unavailable">Wallet unavailable. Please check your connection and sign in again.</span> <button type="button" onclick="location.reload()" data-i18n="common.retry">Try again</button></div>

    <div id="walletStats"><p role="status">Loading wallet…</p></div>

    <div class="ss-wallet-ledger bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <h2 class="font-bold text-gray-900" data-i18n="wallet.recentTransactions">Recent Transactions</h2>
        <button onclick="window.WalletManager.showWithdrawModal()"
          class="flex items-center gap-2 px-4 py-2 bg-[#064e3b] text-white rounded-lg text-sm font-bold hover:opacity-90 transition-opacity">
          <span class="material-symbols-outlined text-base">payments</span>
          <span data-i18n="wallet.withdraw">Withdraw</span>
        </button>
      </div>
      <div id="walletTx"></div>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-gray-200">
    <div class="max-w-5xl mx-auto grid grid-cols-4">
      <a href="home.html" class="flex flex-col items-center py-2.5 text-xs text-gray-500 hover:text-[#064e3b]">
        <span class="material-symbols-outlined">home</span> Home
      </a>
      <a href="store.html" class="flex flex-col items-center py-2.5 text-xs text-gray-500 hover:text-[#064e3b]">
        <span class="material-symbols-outlined">storefront</span> Shop
      </a>
      <a href="cart.html" class="flex flex-col items-center py-2.5 text-xs text-gray-500 hover:text-[#064e3b]">
        <span class="material-symbols-outlined">shopping_cart</span> Cart
      </a>
      <a href="profile.html" class="flex flex-col items-center py-2.5 text-xs text-[#064e3b] font-semibold">
        <span class="material-symbols-outlined">account_balance_wallet</span> Wallet
      </a>
    </div>
  </nav>

  <script type="module" src="config/firebase-config.js?v=5"></script>
  <script src="js/toast.js?v=1"></script>
  <script src="js/wallet-manager.js"></script>
  <script>
    // ─── nTZS deposit status (from ?ntzs=deposit&depositId=…&orderId=…) ───
    // Money routes are auth-gated server-side — attach the Firebase ID token.
    async function ntzsAuthHeaders() {
      try {
        const token = window.auth?.currentUser ? await window.auth.currentUser.getIdToken() : null;
        return token ? { 'Authorization': 'Bearer ' + token } : {};
      } catch (e) { return {}; }
    }

    function ntzsStatusPill(status) {
      const s = (status || '').toLowerCase();
      const cls = ['minted', 'completed', 'settled'].includes(s) ? 'status-completed'
        : ['failed', 'rejected', 'cancelled', 'expired'].includes(s) ? 'status-failed'
        : 'status-pending';
      const icon = cls === 'status-completed' ? 'check_circle' : cls === 'status-failed' ? 'error' : 'hourglass_top';
      return `<span class="status-pill ${cls}"><span class="material-symbols-outlined" style="font-size:14px;">${icon}</span>${s || 'pending'}</span>`;
    }

    function renderNtzsBanner(state, depositId, orderId, detail) {
      const el = document.getElementById('ntzsBanner');
      let html = '';
      if (state === 'loading') {
        html = `
          <div class="ntzs-card bg-white rounded-xl shadow-sm p-4 flex items-center gap-3">
            <span class="material-symbols-outlined spin text-purple-600">progress_activity</span>
            <div class="flex-1">
              <p class="font-bold text-sm text-gray-900">${t('wallet.depositProgress')}</p>
              <p class="text-xs text-gray-500">Deposit <code>${depositId}</code>${orderId ? ` · order <code>${orderId}</code>` : ''} — complete the mobile-money prompt if you haven't yet.</p>
            </div>
            ${ntzsStatusPill(detail || 'pending')}
          </div>`;
      } else if (state === 'completed') {
        html = `
          <div class="ntzs-card bg-white rounded-xl shadow-sm p-4 flex items-center gap-3">
            <span class="material-symbols-outlined text-green-600">check_circle</span>
            <div class="flex-1">
              <p class="font-bold text-sm text-gray-900">nTZS deposit completed 🎉</p>
              <p class="text-xs text-gray-500">Your payment settled${orderId ? ` and order <code>${orderId}</code> is being processed` : ''}.</p>
            </div>
            ${ntzsStatusPill(detail || 'completed')}
          </div>`;
      } else if (state === 'failed') {
        html = `
          <div class="bg-white rounded-xl shadow-sm p-4 flex items-start gap-3" style="border-left:4px solid #dc2626;">
            <span class="material-symbols-outlined text-red-600">error</span>
            <div class="flex-1">
              <p class="font-bold text-sm text-gray-900">${t('wallet.depositFailed')}</p>
              <p class="text-xs text-gray-500">${detail || 'The deposit could not be completed. You can retry checkout or contact support.'}</p>
              <button onclick="location.href='/checkout'" class="mt-2 px-4 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold hover:bg-red-700 transition-colors">${t('wallet.retryCheckout')}</button>
            </div>
            ${ntzsStatusPill(detail || 'failed')}
          </div>`;
      }
      el.innerHTML = html;
      el.classList.remove('hidden');
      try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    }

    async function pollNtzsDeposit(depositId, orderId) {
      renderNtzsBanner('loading', depositId, orderId);
      let attempts = 0;
      const maxAttempts = 60; // ~3 min at 3s intervals
      while (attempts < maxAttempts) {
        attempts++;
        try {
          const res = await fetch(`/api/payments/ntzs/deposit/${encodeURIComponent(depositId)}`, {
            headers: await ntzsAuthHeaders()
          });
          if (res.status === 401 || res.status === 403) {
            renderNtzsBanner('failed', depositId, orderId, res.status === 401 ? 'sign in required' : 'forbidden');
            return;
          }
          const json = await res.json();
          const st = (json.data && json.data.status) || '';
          const s = st.toLowerCase();
          if (['minted', 'completed', 'settled'].includes(s)) {
            renderNtzsBanner('completed', depositId, orderId, st);
            return;
          }
          if (['failed', 'rejected', 'cancelled', 'expired'].includes(s)) {
            renderNtzsBanner('failed', depositId, orderId, st);
            return;
          }
          renderNtzsBanner('loading', depositId, orderId, st || 'pending');
        } catch (e) {
          console.warn('nTZS status poll failed:', e.message);
        }
        await new Promise(r => setTimeout(r, 3000));
      }
      // Timed out polling — leave the pending card up with a hint
      const el = document.getElementById('ntzsBanner');
      el.insertAdjacentHTML('beforeend',
        '<p class="text-xs text-gray-400 mt-2 ml-1">' + t('wallet.pendingHint') + '</p>');
    }

    // ─── Wallet data ───
    async function loadWallet() {
      // nTZS params take priority
      const params = new URLSearchParams(location.search);
      if (params.get('ntzs') === 'deposit' && params.get('depositId')) {
        pollNtzsDeposit(params.get('depositId'), params.get('orderId'));
      }

      let data = null;
      let tx = [];
      try {
        data = await window.WalletManager.getWallet();
        tx = (await window.WalletManager.getTransactions()).transactions || [];
      } catch (e) {
        document.getElementById('walletError').classList.remove('hidden');
        document.getElementById('walletStats').replaceChildren();
        document.getElementById('walletTx').replaceChildren();
        return;
      }
      document.getElementById('walletError').classList.add('hidden');
      window.WalletManager.renderWallet('walletStats', data);
      window.WalletManager.renderTransactions('walletTx', tx);
    }
  </script>
  <script type="module">
    import { auth } from '/config/firebase-config.js?v=5';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
    onAuthStateChanged(auth, () => loadWallet());
  </script>
</body>
</html>
