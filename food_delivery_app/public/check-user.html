<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check User | SmartSoko</title>
  <link rel="stylesheet" href="dist/tailwind.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0fdf4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 40px -10px rgba(1,45,29,0.2); max-width: 600px; width: 100%; }
    .btn { background: #064e3b; color: white; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; border: none; cursor: pointer; margin: 5px; }
    .btn:hover { opacity: 0.9; }
    .info-box { background: #f3f4f6; padding: 1rem; border-radius: 0.75rem; margin: 1rem 0; font-family: monospace; font-size: 0.875rem; white-space: pre-wrap; word-break: break-word; }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-gray-900 mb-4">User Diagnostic</h1>
    
    <div id="authSection">
      <h2 class="font-semibold mb-2">Firebase Auth Status:</h2>
      <div id="authStatus" class="info-box">Checking...</div>
    </div>

    <div id="firestoreSection" class="mt-4 hidden">
      <h2 class="font-semibold mb-2">Firestore User Document:</h2>
      <div id="firestoreStatus" class="info-box">Checking...</div>
    </div>

    <div class="mt-6 flex flex-wrap">
      <button onclick="loginTestMerchant()" class="btn">Login Test Merchant</button>
      <button onclick="checkStatus()" class="btn bg-gray-600">Refresh Check</button>
      <a href="/login" class="btn bg-blue-600 inline-block text-center">Go to Login</a>
    </div>

    <div id="result" class="mt-4"></div>
  </div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBKliW4sQwBFEYMptJ8VuWYHTJ73DbHoE",
      authDomain: "fooddelievry-dce15.firebaseapp.com",
      projectId: "fooddelievry-dce15",
      storageBucket: "fooddelievry-dce15.firebasestorage.app",
      messagingSenderId: "727819507148",
      appId: "1:727819507148:web:372bee2608d5c7a9587969"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function checkStatus() {
      const authStatus = document.getElementById('authStatus');
      const firestoreSection = document.getElementById('firestoreSection');
      const firestoreStatus = document.getElementById('firestoreStatus');
      const result = document.getElementById('result');

      // Check Auth
      const user = auth.currentUser;
      if (user) {
        authStatus.innerHTML = `<span class="success">✓ LOGGED IN</span>\nUID: ${user.uid}\nEmail: ${user.email}\nDisplay Name: ${user.displayName || 'N/A'}`;
        authStatus.classList.add('success');
        
        // Check Firestore
        firestoreSection.classList.remove('hidden');
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            firestoreStatus.innerHTML = `<span class="success">✓ USER DOCUMENT EXISTS</span>\n${JSON.stringify(data, null, 2)}`;
            firestoreStatus.classList.add('success');
            
            // Check role
            if (data.role === 'merchant') {
              result.innerHTML = `<div class="success p-4 rounded-lg"><strong>✓ SUCCESS!</strong><br>You have merchant role.<br><a href="/merchant" class="underline">Go to Merchant Dashboard →</a></div>`;
            } else {
              result.innerHTML = `<div class="error p-4 rounded-lg"><strong>✗ WRONG ROLE</strong><br>Your role is: ${data.role}<br>Merchant pages require 'merchant' role.</div>`;
            }
          } else {
            firestoreStatus.innerHTML = `<span class="error">✗ NO USER DOCUMENT</span>\nThe users/${user.uid} document doesn't exist in Firestore.`;
            firestoreStatus.classList.add('error');
            result.innerHTML = `<div class="error p-4 rounded-lg"><strong>Fix:</strong> Create the user document in Firestore with role 'merchant'.</div>`;
          }
        } catch (e) {
          firestoreStatus.innerHTML = `<span class="error">Error: ${e.message}</span>`;
          firestoreStatus.classList.add('error');
        }
      } else {
        authStatus.innerHTML = `<span class="error">✗ NOT LOGGED IN</span>\nNo Firebase Auth user found.`;
        authStatus.classList.add('error');
        firestoreSection.classList.add('hidden');
        result.innerHTML = `<div class="error p-4 rounded-lg">You need to login first. <a href="/login" class="underline">Go to Login</a></div>`;
      }
    }

    async function loginTestMerchant() {
      const result = document.getElementById('result');
      result.innerHTML = 'Logging in testmerchant@smartsoko.com...';
      
      try {
        const userCredential = await signInWithEmailAndPassword(auth, 'testmerchant@smartsoko.com', 'TestMerchant123!');
        result.innerHTML = `<div class="success p-4 rounded-lg">✓ Login successful! Click "Refresh Check" to verify.</div>`;
        setTimeout(checkStatus, 500);
      } catch (error) {
        result.innerHTML = `<div class="error p-4 rounded-lg">✗ Login failed: ${error.message}<br><br>If account doesn't exist, go to <a href="/seed-merchant">seed-merchant</a> first.</div>`;
      }
    }

    // Auto-check on load
    onAuthStateChanged(auth, (user) => {
      checkStatus();
    });

    window.checkStatus = checkStatus;
    window.loginTestMerchant = loginTestMerchant;
  </script>
</body>
</html>
