version: '3.8'

services:
  smart-soko:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Firebase credentials (replace with actual values or use Docker secrets)
      - FIREBASE_PROJECT_ID=fooddelievry-dce15
      - FIREBASE_PRIVATE_KEY=
      - FIREBASE_CLIENT_EMAIL=
      # Supabase credentials (set in .env or your environment — never commit service keys)
      - SUPABASE_URL=https://vonkqyiczeqhuqhahsxm.supabase.co
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:?set SUPABASE_SERVICE_KEY in .env}
      # Other optional environment variables
      - FIREBASE_SERVICE_ACCOUNT=serviceAccountKey.json
    volumes:
      # Mount service account key if available locally
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    restart: unless-stopped