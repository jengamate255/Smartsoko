[build]
  publish = "public"
  command = "echo Static build complete"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirect table trimmed to pages that actually exist in public/ (Netlify publishes "public").
# Dropped routes whose target pages were removed: /register, /signup, /dashboard,
# /merchant, /login, /forgot-password, /home, /discovery, /track-order, /profile,
# /orders, /chat, /referral, /seller, /restaurant, /admin, /admin-panel,
# /fleet-manager, /main.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

