<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartSoko — Social</title>
  <meta name="theme-color" content="#064E3B">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="css/social.css">
  <script type="module" src="config/firebase-config.js?v=3"></script>
  <script src="auth-check.js?v=4" defer></script>
  <script src="js/cart-service.js" defer></script>
  <script src="js/social-service.js" defer></script>
  <script src="nav-component.js" defer></script>
</head>
<body class="soc-page">
  <div class="h-16 md:h-20"></div>

  <main class="soc-container">
    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px;">
      <h1 style="font-size:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;">
        <span class="material-symbols-outlined" style="font-size:28px;color:#E63946;font-variation-settings:'FILL' 1;">groups</span>
        Soko Social
      </h1>
      <div style="display:flex;gap:8px;">
        <a href="/messages" class="soc-tool" style="position:relative;text-decoration:none;" aria-label="Messages">
          <span class="material-symbols-outlined">chat</span>
          <span id="unreadBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:#E63946;color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;"></span>
        </a>
        <a href="/wishlists" class="soc-tool" style="text-decoration:none;" aria-label="Collections">
          <span class="material-symbols-outlined">collections_bookmark</span>
        </a>
      </div>
    </div>

    <!-- Filter chips -->
    <div style="display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;" id="catChips">
      <button class="soc-btn soc-btn-outline" data-cat="" style="white-space:nowrap;">For You</button>
      <button class="soc-btn soc-btn-outline" data-cat="food" style="white-space:nowrap;">Food</button>
      <button class="soc-btn soc-btn-outline" data-cat="fashion" style="white-space:nowrap;">Fashion</button>
      <button class="soc-btn soc-btn-outline" data-cat="bakery" style="white-space:nowrap;">Bakery</button>
      <button class="soc-btn soc-btn-outline" data-cat="groceries" style="white-space:nowrap;">Groceries</button>
      <button class="soc-btn soc-btn-outline" data-cat="beauty" style="white-space:nowrap;">Beauty</button>
    </div>

    <!-- Stories -->
    <div class="soc-stories" id="storiesRail"></div>

    <!-- Composer -->
    <div class="soc-composer" id="composerTrigger">
      <div class="soc-composer-row">
        <div class="soc-avatar" id="meAvatar">
          <span class="material-symbols-outlined" style="font-size:20px;">person</span>
        </div>
        <div class="soc-composer-input" id="openComposer">Share what you're shopping for...</div>
      </div>
      <div style="display:flex;gap:4px;margin-top:10px;border-top:1px solid var(--soc-border);padding-top:10px;">
        <button class="soc-action" onclick="openComposerModal('photo')">
          <span class="material-symbols-outlined" style="color:#10b981;">photo_camera</span>
          Photo
        </button>
        <button class="soc-action" onclick="openComposerModal('product')">
          <span class="material-symbols-outlined" style="color:#f59e0b;">shopping_bag</span>
          Product
        </button>
        <button class="soc-action" onclick="openStoryModal()">
          <span class="material-symbols-outlined" style="color:#E63946;">add_circle</span>
          Story
        </button>
      </div>
    </div>

    <!-- Feed -->
    <div id="feedList">
      <!-- Skeleton -->
      <div class="soc-post"><div class="soc-skeleton" style="height:320px;"></div></div>
      <div class="soc-post"><div class="soc-skeleton" style="height:240px;"></div></div>
    </div>
  </main>

  <!-- Composer Modal -->
  <div id="composerModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal soc-composer-modal">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="closeComposerModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>Create post</h2>
        <button class="soc-btn soc-btn-primary" id="publishBtn" onclick="publishPost()">
          <span class="material-symbols-outlined" style="font-size:16px;">send</span>
          Post
        </button>
      </div>
      <div class="soc-modal-body">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;">
          <div class="soc-avatar" id="modalAvatar"></div>
          <div>
            <div id="modalName" style="font-weight:700;font-size:14px;">You</div>
            <select id="visibilitySelect" style="font-size:11px;border:1px solid var(--soc-border);border-radius:6px;padding:2px 6px;background:var(--soc-surface-2);">
              <option value="public">🌍 Public</option>
              <option value="followers">👥 Followers only</option>
              <option value="private">🔒 Only me</option>
            </select>
          </div>
        </div>
        <textarea id="postText" placeholder="What did you find today? Share with the soko..." maxlength="1200"></textarea>
        <div class="soc-image-preview" id="imagePreview"></div>
        <div class="soc-tag-chips" id="productChips"></div>
        <div class="soc-composer-tools">
          <input type="file" id="postPhotoInput" accept="image/*" multiple style="display:none;" onchange="handlePhotoFiles(event)">
          <button class="soc-tool" onclick="document.getElementById('postPhotoInput').click()" aria-label="Add photo">
            <span class="material-symbols-outlined">add_photo_alternate</span>
          </button>
          <button class="soc-tool" onclick="openProductPicker()" aria-label="Tag product">
            <span class="material-symbols-outlined">shopping_bag</span>
          </button>
          <select id="categorySelect" style="margin-left:auto;border:1px solid var(--soc-border);border-radius:10px;padding:6px 10px;font:600 12px 'Plus Jakarta Sans',sans-serif;background:#fff;">
            <option value="">Category</option>
            <option value="food">Food</option>
            <option value="fashion">Fashion</option>
            <option value="bakery">Bakery</option>
            <option value="groceries">Groceries</option>
            <option value="beauty">Beauty</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Picker Modal -->
  <div id="productPickerModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="closeProductPicker()">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>Tag a product</h2>
      </div>
      <div class="soc-modal-body">
        <input id="productSearch" type="text" placeholder="Search products..." style="width:100%;border:1px solid var(--soc-border);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;margin-bottom:14px;outline:none;">
        <div id="productResults"></div>
      </div>
    </div>
  </div>

  <!-- Story Modal -->
  <div id="storyModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal" style="max-width:420px;">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="closeStoryModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>Share a story (24h)</h2>
        <button class="soc-btn soc-btn-hot" id="postStoryBtn" onclick="publishStory()">
          <span class="material-symbols-outlined" style="font-size:16px;">send</span>
          Post
        </button>
      </div>
      <div class="soc-modal-body">
        <input type="file" id="storyPhotoInput" accept="image/*" style="display:none;" onchange="handleStoryPhoto(event)">
        <div id="storyPreview" style="aspect-ratio:9/16;border-radius:14px;background:var(--soko-grad-hot);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;overflow:hidden;position:relative;" onclick="document.getElementById('storyPhotoInput').click()">
          <div style="text-align:center;">
            <span class="material-symbols-outlined" style="font-size:56px;display:block;">add_photo_alternate</span>
            <p style="margin:6px 0 0;font-weight:700;">Tap to add photo</p>
          </div>
        </div>
        <input id="storyText" type="text" placeholder="Add a caption (optional)" maxlength="200" style="width:100%;border:1px solid var(--soc-border);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;margin-top:12px;outline:none;">
      </div>
    </div>
  </div>

  <!-- Story Viewer -->
  <div id="storyViewer" class="soc-modal-overlay" style="display:none;background:#000;padding:0;">
    <div id="storyViewerContent" style="width:100%;max-width:480px;height:100dvh;position:relative;display:flex;align-items:center;justify-content:center;background:#000;"></div>
  </div>

  <!-- Comments Modal -->
  <div id="commentsModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal" style="height:80dvh;">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="closeCommentsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>Comments</h2>
      </div>
      <div class="soc-modal-body" id="commentsBody"></div>
      <div class="soc-modal-foot" style="background:#fff;">
        <form id="commentForm" style="display:flex;gap:8px;width:100%;" onsubmit="submitComment(event)">
          <input id="commentInput" placeholder="Add a comment..." style="flex:1;border:1px solid var(--soc-border);border-radius:999px;padding:10px 14px;font:inherit;font-size:14px;outline:none;">
          <button type="submit" class="soc-btn soc-btn-primary">Post</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    SmartNav?.init?.({ activePage: 'social', role: 'customer', showSearch: false });
  </script>
  <script src="js/social-page.js" defer></script>
</body>
</html>
