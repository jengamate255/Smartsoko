<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartSoko — Messages</title>
  <meta name="theme-color" content="#064E3B">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="css/social.css">
  <script type="module" src="config/firebase-config.js?v=3"></script>
  <script type="module" src="config/cross-platform-service.js?v=4"></script>
  <script src="auth-check.js?v=4" defer></script>
  <script src="js/cart-service.js" defer></script>
  <script src="js/social-service.js" defer></script>
  <script src="nav-component.js" defer></script>
</head>
<body class="soc-page">
  <div class="h-16 md:h-20"></div>

  <main class="soc-container">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;">
      <h1 style="font-size:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;">
        <a href="/social" id="backBtn" style="background:transparent;border:none;display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;color:inherit;text-decoration:none;cursor:pointer;">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <span class="material-symbols-outlined" style="font-size:28px;color:#064E3B;font-variation-settings:'FILL' 1;">forum</span>
        <span id="pageTitle">Messages</span>
      </h1>
      <button class="soc-tool" onclick="window.MessagesPage.openNew()" aria-label="New message">
        <span class="material-symbols-outlined">edit_square</span>
      </button>
    </div>

    <!-- Inbox view -->
    <div id="inboxView">
      <div class="soc-conv-list" id="convList">
        <div style="padding:14px;"><div class="soc-skeleton" style="height:60px;margin-bottom:8px;"></div><div class="soc-skeleton" style="height:60px;"></div></div>
      </div>
    </div>

    <!-- Thread view -->
    <div id="threadView" style="display:none;">
      <div class="soc-thread">
        <div class="soc-thread-head">
          <div class="soc-avatar" id="threadAvatar"></div>
          <div style="flex:1;">
            <a id="threadName" href="#" style="font-weight:700;font-size:14px;text-decoration:none;color:inherit;display:block;">User</a>
            <div style="font-size:11px;color:var(--soc-text-dim);" id="threadSub">Tap name to view profile</div>
          </div>
        </div>
        <div class="soc-thread-body" id="threadBody"></div>
        <form class="soc-thread-foot" onsubmit="window.MessagesPage.send(event)">
          <input id="msgInput" type="text" placeholder="Message..." autocomplete="off">
          <button type="submit" aria-label="Send">
            <span class="material-symbols-outlined" style="color:#fff;">send</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- New conversation modal -->
  <div id="newModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="document.getElementById('newModal').style.display='none'">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>New message</h2>
      </div>
      <div class="soc-modal-body">
        <input id="userSearch" type="text" placeholder="Search shoppers..." style="width:100%;border:1px solid var(--soc-border);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;margin-bottom:14px;outline:none;">
        <div id="userResults"></div>
      </div>
    </div>
  </div>

<script>
      (function initNav() { if (window.SmartNav && SmartNav.init) { SmartNav.init({ activePage: 'social', role: 'customer', showSearch: false }); } else { setTimeout(initNav, 100); } })();
    </script>
  <script src="js/messages-page.js" defer></script>
</body>
</html>
