<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartSoko — Profile</title>
  <meta name="theme-color" content="#064E3B">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="css/social.css">
  <script type="module" src="config/firebase-config.js?v=3"></script>
  <script type="module" src="config/cross-platform-service.js?v=4"></script>
  <script src="js/cart-service.js" defer></script>
  <script src="js/social-service.js" defer></script>
  <script src="nav-component.js" defer></script>
</head>
<body class="soc-page">
  <div class="h-16 md:h-20"></div>

  <main class="soc-container">
    <!-- Profile header skeleton -->
    <div id="profileHead">
      <div class="soc-profile-cover"><div class="soc-skeleton" style="width:100%;height:100%;border-radius:0;"></div></div>
      <div class="soc-profile-head">
        <div class="soc-profile-avatar-wrap">
          <div class="soc-profile-avatar soc-skeleton" style="background:#e2e8f0;"></div>
        </div>
        <div class="soc-skeleton" style="width:60%;height:20px;margin-bottom:8px;"></div>
        <div class="soc-skeleton" style="width:40%;height:14px;"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="soc-tabs" id="profileTabs" style="display:none;">
      <button class="soc-tab active" data-tab="posts">
        <span class="material-symbols-outlined">grid_on</span>
        Posts
      </button>
      <button class="soc-tab" data-tab="wishlists">
        <span class="material-symbols-outlined">collections_bookmark</span>
        Collections
      </button>
      <button class="soc-tab" data-tab="following">
        <span class="material-symbols-outlined">group</span>
        Following
      </button>
    </div>

    <!-- Tab content -->
    <div id="tabContent"></div>
  </main>

  <!-- Edit profile modal -->
  <div id="editModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="document.getElementById('editModal').style.display='none'">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>Edit profile</h2>
        <button class="soc-btn soc-btn-primary" onclick="saveProfile()">Save</button>
      </div>
      <div class="soc-modal-body">
        <div style="display:flex;justify-content:center;margin-bottom:20px;">
          <label style="cursor:pointer;position:relative;">
            <div class="soc-avatar xl" id="editAvatar"></div>
            <div style="position:absolute;bottom:0;right:0;background:#064e3b;border:3px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#fff;">
              <span class="material-symbols-outlined" style="font-size:16px;">photo_camera</span>
            </div>
            <input type="file" id="editAvatarInput" accept="image/*" style="display:none;" onchange="handleAvatarFile(event)">
          </label>
        </div>
        <label style="display:block;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--soc-text-dim);margin-bottom:6px;">DISPLAY NAME</div>
          <input id="editName" type="text" maxlength="50" style="width:100%;border:1px solid var(--soc-border);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;outline:none;">
        </label>
        <label style="display:block;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--soc-text-dim);margin-bottom:6px;">USERNAME</div>
          <input id="editUsername" type="text" maxlength="30" pattern="[a-z0-9_]+" style="width:100%;border:1px solid var(--soc-border);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;outline:none;">
        </label>
        <label style="display:block;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--soc-text-dim);margin-bottom:6px;">BIO</div>
          <textarea id="editBio" maxlength="160" rows="3" style="width:100%;border:1px solid var(--soc-border);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;outline:none;resize:vertical;"></textarea>
        </label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input id="editPublic" type="checkbox" style="width:18px;height:18px;">
          <span style="font-size:14px;">Public profile (anyone can find me)</span>
        </label>
      </div>
    </div>
  </div>

<script>
      (function initNav() { if (window.SmartNav && SmartNav.init) { SmartNav.init({ activePage: 'social', role: 'customer', showSearch: false }); } else { setTimeout(initNav, 100); } })();
    </script>
  <script src="js/social-profile-page.js" defer></script>
</body>
</html>
