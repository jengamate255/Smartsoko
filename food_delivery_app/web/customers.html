<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — SmartSoko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script type="module" src="config/firebase-config.js"></script>
  <script type="module" src="config/cross-platform-service.js?v=4"></script>
  <script src="auth-check.js" defer></script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen">
  <div class="min-h-screen flex flex-col">
    <header class="bg-surface border-b border-outline/10 px-6 py-4">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="/merchant" class="text-on-surface-variant hover:text-primary transition"><span class="material-symbols-outlined">arrow_back</span></a>
          <div>
            <h1 class="font-headline text-xl font-bold text-on-surface">Customers</h1>
            <p class="text-sm text-on-surface-variant">Manage your customer relationships</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-on-surface-variant" id="customerCount">0 customers</span>
        </div>
      </div>
    </header>

    <div class="flex-1 max-w-6xl mx-auto w-full p-6">
      <div class="bg-surface rounded-3xl border border-outline/20 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-outline/10">
          <div class="flex gap-3">
            <div class="flex-1 relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
              <input type="text" id="customerSearch" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-outline-variant bg-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm" placeholder="Search customers by name, phone, or email...">
            </div>
            <select id="customerSort" class="px-4 py-2.5 rounded-xl border border-outline-variant bg-surface text-sm focus:border-primary outline-none">
              <option value="orders">Most orders</option>
              <option value="spend">Highest spend</option>
              <option value="recent">Recent</option>
              <option value="name">Name A-Z</option>
            </select>
          </div>
        </div>

        <div id="loadingCustomers" class="flex items-center justify-center py-20">
          <div class="text-center"><svg class="animate-spin h-8 w-8 text-primary mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg><p class="text-sm text-on-surface-variant">Loading customers...</p></div>
        </div>

        <div id="customersList" class="divide-y divide-outline/10"></div>

        <div id="noCustomers" class="hidden py-20 text-center">
          <span class="material-symbols-outlined text-5xl text-on-surface-variant mb-3">group_off</span>
          <p class="text-on-surface-variant font-medium">No customers yet</p>
          <p class="text-sm text-on-surface-variant">Customers will appear here after they place orders</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Customer Detail Modal -->
  <div id="customerModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-surface rounded-3xl shadow-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto">
      <div class="sticky top-0 bg-surface z-10 p-6 border-b border-outline/10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center"><span id="modalCustomerInitial" class="text-primary font-bold text-lg">?</span></div>
          <div><h2 id="modalCustomerName" class="font-headline font-bold text-lg">Customer</h2><p id="modalCustomerSince" class="text-xs text-on-surface-variant">First order: —</p></div>
        </div>
        <button onclick="closeCustomerModal()" class="text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-3 gap-4">
          <div class="p-4 bg-surface-container rounded-2xl text-center"><p class="text-2xl font-bold text-primary" id="modalTotalOrders">0</p><p class="text-xs text-on-surface-variant">Orders</p></div>
          <div class="p-4 bg-surface-container rounded-2xl text-center"><p class="text-2xl font-bold text-green-600" id="modalTotalSpend">TSh 0</p><p class="text-xs text-on-surface-variant">Total Spend</p></div>
          <div class="p-4 bg-surface-container rounded-2xl text-center"><p class="text-2xl font-bold text-blue-600" id="modalAvgOrder">TSh 0</p><p class="text-xs text-on-surface-variant">Avg Order</p></div>
        </div>
        <div class="flex gap-2">
          <button id="modalMessageBtn" class="flex-1 py-2.5 rounded-xl bg-primary text-on-primary font-semibold text-sm hover:opacity-90 transition flex items-center justify-center gap-2"><span class="material-symbols-outlined text-lg">message</span> Send Message</button>
          <button id="modalCallBtn" class="py-2.5 px-4 rounded-xl border border-outline-variant hover:bg-surface-container transition"><span class="material-symbols-outlined text-on-surface-variant">call</span></button>
        </div>
        <div><h3 class="font-semibold text-sm text-on-surface mb-3">Order History</h3><div id="modalOrderHistory" class="space-y-2"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/data-service.js"></script>
  <script type="module" src="js/customers.js?v=1"></script>
</body>
</html>
