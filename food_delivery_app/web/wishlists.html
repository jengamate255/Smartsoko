<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartSoko — Collections</title>
  <meta name="theme-color" content="#064E3B">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/tailwind.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="css/social.css">
  <script type="module" src="config/firebase-config.js?v=3"></script>
  <script type="module" src="config/cross-platform-service.js?v=4"></script>
  <script src="js/cart-service.js" defer></script>
  <script src="js/social-service.js" defer></script>
  <script src="nav-component.js" defer></script>
</head>
<body class="soc-page">
  <div class="h-16 md:h-20"></div>

  <main class="soc-container soc-wide">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;">
      <h1 style="font-size:24px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;">
        <a href="/social" id="backBtn" style="display:none;background:transparent;border:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;color:inherit;text-decoration:none;">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <span class="material-symbols-outlined" style="font-size:28px;color:#f59e0b;font-variation-settings:'FILL' 1;">collections_bookmark</span>
        <span id="pageTitle">Collections</span>
      </h1>
      <button class="soc-btn soc-btn-primary" onclick="window.WishlistsPage.openCreate()">
        <span class="material-symbols-outlined" style="font-size:16px;">add</span>
        New
      </button>
    </div>

    <!-- Tabs -->
    <div class="soc-tabs" id="wlTabs">
      <button class="soc-tab active" data-tab="mine">
        <span class="material-symbols-outlined">person</span>
        Mine
      </button>
      <button class="soc-tab" data-tab="discover">
        <span class="material-symbols-outlined">trending_up</span>
        Discover
      </button>
    </div>

    <!-- List view -->
    <div id="listView">
      <div class="soc-wl-grid" id="wlGrid">
        <div class="soc-skeleton" style="height:240px;"></div>
        <div class="soc-skeleton" style="height:240px;"></div>
        <div class="soc-skeleton" style="height:240px;"></div>
      </div>
    </div>

    <!-- Detail view -->
    <div id="detailView" style="display:none;">
      <div id="detailHead" class="soc-composer" style="padding:0;overflow:hidden;"></div>
      <div id="detailItems"></div>
    </div>
  </main>

  <!-- Create modal -->
  <div id="createModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="document.getElementById('createModal').style.display='none'">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>New collection</h2>
        <button class="soc-btn soc-btn-primary" onclick="window.WishlistsPage.create()">Create</button>
      </div>
      <div class="soc-modal-body">
        <label style="display:block;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--soc-text-dim);margin-bottom:6px;">TITLE</div>
          <input id="newTitle" type="text" maxlength="80" placeholder="My Ramadan picks" style="width:100%;border:1px solid var(--soc-border);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;outline:none;">
        </label>
        <label style="display:block;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--soc-text-dim);margin-bottom:6px;">DESCRIPTION (OPTIONAL)</div>
          <textarea id="newDesc" maxlength="400" rows="3" placeholder="What's this collection about?" style="width:100%;border:1px solid var(--soc-border);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;outline:none;resize:vertical;"></textarea>
        </label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input id="newPublic" type="checkbox" checked style="width:18px;height:18px;">
          <span style="font-size:14px;">🌍 Public — anyone can find and follow</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Add product to collection modal -->
  <div id="addToModal" class="soc-modal-overlay" style="display:none;">
    <div class="soc-modal">
      <div class="soc-modal-head">
        <button class="soc-modal-close" onclick="document.getElementById('addToModal').style.display='none'">
          <span class="material-symbols-outlined">close</span>
        </button>
        <h2>Add product</h2>
      </div>
      <div class="soc-modal-body">
        <input id="addSearch" type="text" placeholder="Search products..." style="width:100%;border:1px solid var(--soc-border);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;margin-bottom:14px;outline:none;">
        <div id="addResults"></div>
      </div>
    </div>
  </div>

<script>
      (function initNav() { if (window.SmartNav && SmartNav.init) { SmartNav.init({ activePage: 'social', role: 'customer', showSearch: false }); } else { setTimeout(initNav, 100); } })();
    </script>
  <script src="js/wishlists-page.js" defer></script>
</body>
</html>
