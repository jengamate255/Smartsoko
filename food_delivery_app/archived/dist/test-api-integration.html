<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Performance: Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Integration Test - SmartSoko</title>
  <link rel="preload" href="dist/tailwind.css" as="style">
  <link rel="stylesheet" href="dist/tailwind.css">
  <script src="config/api-config.js"></script>
  <style> .test-result {transition: all 0.3s ease} .test-result.success {border-left: 4px solid #10b981;background-color: #f0fdf4} .test-result.error {border-left: 4px solid #ef4444;background-color: #fef2f2} .test-result.pending {border-left: 4px solid #f59e0b;background-color: #fffbeb} </style>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">🔌 API Integration Test</h1>
    <p class="text-gray-600 mb-6">Testing frontend-backend connectivity...</p>

    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-2xl">🌐</span>
        <div>
          <h2 class="text-lg font-semibold">API Configuration</h2>
          <p class="text-sm text-gray-600" id="apiUrl">Loading...</p>
        </div>
      </div>
    </div>

    <!-- Test Results -->
    <div class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-lg font-semibold mb-4">Test Results</h2>
      <div id="testResults" class="space-y-3"></div>
    </div>

    <!-- Test Controls -->
    <div class="bg-white rounded-lg shadow-lg p-6 mt-6">
      <h2 class="text-lg font-semibold mb-4">Manual Tests</h2>
      <div class="space-y-2">
        <button onclick="testEndpoint('/api/health')" class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Test Health Check
        </button>
        <button onclick="testEndpoint('/api/sellers')" class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
          Test Get Sellers
        </button>
        <button onclick="testEndpoint('/api/categories')" class="w-full bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
          Test Get Categories
        </button>
        <button onclick="testEndpoint('/api/admin/dashboard')" class="w-full bg-primary text-white px-4 py-2 rounded hover:bg-orange-700">
          Test Admin Dashboard
        </button>
      </div>
    </div>

    <!-- Log Output -->
    <div class="bg-gray-900 text-gray-100 rounded-lg shadow-lg p-6 mt-6">
      <h2 class="text-lg font-semibold mb-4">Console Output</h2>
      <pre id="logs" class="text-sm overflow-auto max-h-96 bg-gray-800 p-4 rounded"></pre>
    </div>
  </div>

  <script>
    const logs = [];
    
    // Override console.log to capture output
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      const message = args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ');
      logs.push(message);
      updateLogs();
    };

    const originalError = console.error;
    console.error = function(...args) {
      originalError.apply(console, args);
      const message = '❌ ERROR: ' + args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ');
      logs.push(message);
      updateLogs();
    };

    function updateLogs() {
      document.getElementById('logs').textContent = logs.join('\n');
      document.getElementById('logs').parentElement.scrollTop = document.getElementById('logs').parentElement.scrollHeight;
    }

    function addTestResult(name, status, message = '', data = null) {
      const resultsDiv = document.getElementById('testResults');
      const resultElement = document.createElement('div');
      resultElement.className = `test-result ${status} p-4 rounded`;
      
      let statusIcon = '⏳';
      if (status === 'success') statusIcon = '✅';
      if (status === 'error') statusIcon = '❌';
      
      resultElement.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="text-2xl">${statusIcon}</span>
          <div class="flex-1">
            <h3 class="font-semibold">${name}</h3>
            <p class="text-sm text-gray-600">${message}</p>
            ${data ? `<pre class="mt-2 text-xs bg-white/50 p-2 rounded overflow-auto">${JSON.stringify(data, null, 2)}</pre>` : ''}
          </div>
        </div>
      `;
      
      resultsDiv.appendChild(resultElement);
      console.log(`${statusIcon} ${name}: ${message}`);
    }

    async function testEndpoint(endpoint) {
      const name = endpoint.split('/').pop() || 'endpoint';
      addTestResult(`Testing: ${endpoint}`, 'pending', 'Running test...');
      
      try {
        const response = await apiHelpers.get(endpoint);
        addTestResult(`Testing: ${endpoint}`, 'success', `Status: OK (${JSON.stringify(response).length} bytes)`, response);
      } catch (error) {
        addTestResult(`Testing: ${endpoint}`, 'error', `Error: ${error.message}`);
      }
    }

    // Display API URL
    document.getElementById('apiUrl').textContent = `Base URL: ${API_BASE_URL}`;

    // Run initial tests
    window.addEventListener('load', () => {
      console.log('🚀 SmartSoko API Integration Test Started');
      console.log('📍 API Base URL:', API_BASE_URL);
      console.log('⏳ Running automatic tests...');
      
      setTimeout(() => testEndpoint('/api/health'), 500);
      setTimeout(() => testEndpoint('/api/sellers'), 1500);
      setTimeout(() => testEndpoint('/api/categories'), 2500);
    });
  </script>
</body>
</html>
