global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smartsoko-perf'
    environment: 'load-test'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'k6'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['k6:6565']
        labels:
          component: 'load-generator'

  - job_name: 'smartsoko-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smartsoko-app:3000']
        labels:
          component: 'application'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          component: 'host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'container'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          component: 'cache'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          component: 'visualization'

  # k6 custom metrics via Prometheus remote write
  - job_name: 'k6-remote-write'
    metrics_path: '/api/v1/write'
    scheme: http
    static_configs:
      - targets: ['prometheus:9090']

remote_write:
  - url: 'http://prometheus:9090/api/v1/write'
    queue_config:
      capacity: 10000
      max_shards: 200
      min_shards: 1
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms

storage:
  tsdb:
    retention_time: 30d
    retention_size: 10GB
    wal_compression: true