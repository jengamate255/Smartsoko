name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "food_delivery_app/lib/**"
      - "food_delivery_app/ios/**"
      - "food_delivery_app/pubspec.yaml"
      - "food_delivery_app/pubspec.lock"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: food_delivery_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: List build output
        run: ls -lh build/ios/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartsoko-ios-unsigned
          path: food_delivery_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14