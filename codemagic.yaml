workflows:
  iOS-release-unsigned:
    name: iOS Release (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: food_delivery_app
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build unsigned app and package IPA
        script: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y smartsoko-unsigned.ipa Payload
    artifacts:
      - smartsoko-unsigned.ipa